<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte de Ventas Automatizado</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #060b13;
      color: #ffffff;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .main-card {
      width: 100%;
      max-width: 950px;
      background-color: #0b1526;
      border: 1px solid #1a2f4c;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
    }
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      background: #08101d;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #1a2f4c;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: bold;
      color: #38bdf8;
    }
    select, input[type="date"] {
      background: #0d1e38;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      outline: none;
    }
    .grid-charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }
    @media (max-width: 768px) {
      .grid-charts { grid-template-columns: 1fr; }
    }
    .chart-box {
      background: #08101d;
      border: 1px solid #1a2f4c;
      border-radius: 8px;
      padding: 15px;
      position: relative;
      height: 380px;
      display: flex;
      flex-direction: column;
    }
    .chart-title {
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .donut-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .donut-center-text {
      position: absolute;
      top: 50%;
      left: 32%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }
    .donut-center-text .number {
      font-size: 38px;
      font-weight: bold;
      color: #00ff66;
      line-height: 1;
    }
    .donut-center-text .label {
      font-size: 11px;
      color: #94a3b8;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .promo-section {
      background: #08101d;
      border: 1px solid #1a2f4c;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 25px;
    }
    .promo-grid {
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .promo-item { text-align: center; min-width: 65px; }
    .promo-badge {
      width: 32px; height: 32px; border-radius: 50%;
      margin: 0 auto 5px auto;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 14px; color: #ffffff;
    }
    .promo-name { font-size: 11px; color: #64748b; font-weight: bold; }
    
    .paste-section {
      background: #0d1e38;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 15px;
    }
    .paste-title { color: #38bdf8; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
    textarea {
      width: 100%;
      height: 120px;
      background: #08101d;
      border: 1px solid #1a2f4c;
      color: #38bdf8;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      resize: vertical;
    }
    .btn-paste {
      background: #38bdf8;
      color: #060b13;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="main-card">
  <div class="header">
    <div class="header-title">
      <span>REPORTE DE VENTAS DE LA</span>
      <select id="turnoSelect">
        <option value="MAÑANA" selected>MAÑANA</option>
        <option value="NOCHE">NOCHE</option>
      </select>
    </div>
    <div>
      <input type="date" id="fechaReporte" value="2026-09-28">
    </div>
  </div>

  <div class="grid-charts">
    <div class="chart-box">
      <div class="chart-title">VENTAS POR ASESOR</div>
      <div style="flex:1; position:relative;"><canvas id="barChart"></canvas></div>
    </div>
    <div class="chart-box">
      <div class="chart-title">PORCENTAJE DEL TOTAL</div>
      <div class="donut-container">
        <canvas id="donutChart"></canvas>
        <div class="donut-center-text">
          <div class="number" id="totalVentasCentral">0</div>
          <div class="label">VENTAS</div>
        </div>
      </div>
    </div>
  </div>

  <div class="promo-section">
    <div style="font-size: 13px; font-weight: bold; color: #94a3b8; margin-bottom: 15px;">
      RESUMEN | TOTAL DE PROMOCIONES: <span id="totalPromosHeader" style="color:#ffffff;">0</span>
    </div>
    <div class="promo-grid" id="promoGrid"></div>
  </div>

  <div class="paste-section">
    <div class="paste-title">📋 PEGAR TABLA DE EXCEL AQUÍ:</div>
    <textarea id="excelInput" placeholder="Copia y pega las columnas de Excel..."></textarea>
    <button class="btn-paste" onclick="procesarTextoPegado()">⚡ ACTUALIZAR REPORTES</button>
  </div>
</div>

<script>
  Chart.register(ChartDataLabels);

  const coloresNeon = ['#ff6b00', '#00d2ff', '#00ff66', '#e056fd', '#f1c40f', '#ff4757', '#70a1ff', '#2ed573', '#eccc68', '#ff7f50', '#a4b0be', '#a55eea'];

  const productosCatalogo = [
    { nombre: 'CARDIOX', color: '#ef4444' },
    { nombre: 'GLYCONORM', color: '#d97706' },
    { nombre: 'PAPAYA', color: '#84cc16' },
    { nombre: 'CALMANO', color: '#f59e0b' },
    { nombre: 'FLEXACIL', color: '#06b6d4' },
    { nombre: 'ALPHAMAN', color: '#8b5cf6' },
    { nombre: 'MIX', color: '#ec4899' }
  ];

  let asesores = [];
  let conteoProductos = {};
  let barChart, donutChart;

  function procesarTextoPegado() {
    const rawText = document.getElementById('excelInput').value.trim();
    if (!rawText) return;

    asesores = [];
    conteoProductos = { 'CARDIOX': 0, 'GLYCONORM': 0, 'PAPAYA': 0, 'CALMANO': 0, 'FLEXACIL': 0, 'ALPHAMAN': 0, 'MIX': 0 };

    const lineas = rawText.split('\n');

    lineas.forEach((linea) => {
      let l = linea.trim();
      if (!l || l.includes('VENTAS') || l.includes('FECHA') || l.includes('TOTAL') || l.match(/^\d+$/)) return;

      const dateMatch = l.match(/(\d{2}\/\d{2}\/\d{4})/);
      if (dateMatch) {
        const parts = dateMatch[1].split('/');
        document.getElementById('fechaReporte').value = `${parts[2]}-${parts[1]}-${parts[0]}`;
      }

      let partes = l.split('\t').map(p => p.trim()).filter(p => p.length > 0);
      let nombre = '', ventas = 0, promosStr = '';

      if (partes.length >= 3) {
        if (partes[0].match(/\d{2}\/\d{2}\/\d{4}/)) {
          nombre = partes[1];
          ventas = parseInt(partes[2]) || 0;
          promosStr = partes[3] || '';
        } else {
          nombre = partes[0];
          ventas = parseInt(partes[1]) || 0;
          promosStr = partes[2] || '';
        }
      } else if (partes.length === 2) {
        nombre = partes[0];
        ventas = parseInt(partes[1]) || 0;
      } else {
        const match = l.match(/^([A-Z\s]+?)(\d+)(.*)$/i);
        if (match) {
          nombre = match[1].trim();
          ventas = parseInt(match[2]) || 0;
          promosStr = match[3].trim();
        }
      }

      if (nombre && !isNaN(ventas) && ventas > 0) {
        asesores.push({ nombre: nombre.toUpperCase(), ventas: ventas });

        if (promosStr) {
          const promosItems = promosStr.split('/');
          promosItems.forEach(item => {
            const pMatch = item.trim().match(/^(\d+)\s+(.+)$/);
            if (pMatch) {
              const cant = parseInt(pMatch[1]);
              const pNombre = pMatch[2].trim().toUpperCase();
              if (conteoProductos.hasOwnProperty(pNombre)) {
                conteoProductos[pNombre] += cant;
              } else {
                conteoProductos[pNombre] = cant;
              }
            }
          });
        }
      }
    });

    // Ordenar de mayor a menor
    asesores.sort((a, b) => b.ventas - a.ventas);

    // Numerar la lista ordenada
    asesores = asesores.map((item, index) => ({
      nombre: `${index + 1}. ${item.nombre}`,
      ventas: item.ventas
    }));

    actualizarTodo();
  }

  function actualizarTodo() {
    const totalVentas = asesores.reduce((a, b) => a + b.ventas, 0);
    let totalPromos = 0;
    Object.values(conteoProductos).forEach(c => totalPromos += c);

    document.getElementById('totalVentasCentral').innerText = totalVentas;
    document.getElementById('totalPromosHeader').innerText = totalPromos;

    const pGrid = document.getElementById('promoGrid');
    pGrid.innerHTML = '';
    productosCatalogo.forEach(prod => {
      const cant = conteoProductos[prod.nombre] || 0;
      pGrid.innerHTML += `
        <div class="promo-item">
          <div class="promo-badge" style="background-color: ${cant > 0 ? prod.color : '#334155'};">${cant}</div>
          <div class="promo-name">${prod.nombre}</div>
        </div>`;
    });

    const bgColores = asesores.map((_, i) => coloresNeon[i % coloresNeon.length]);

    // 1. Gráfico de Barras con Número DENTRO Y AL MEDIO de la Barra
    if (barChart) barChart.destroy();
    barChart = new Chart(document.getElementById('barChart'), {
      type: 'bar',
      data: {
        labels: asesores.map(a => a.nombre),
        datasets: [{
          data: asesores.map(a => a.ventas),
          backgroundColor: bgColores,
          borderRadius: 4
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          datalabels: {
            anchor: 'center',
            align: 'center',
            color: '#ffffff',
            font: { weight: 'bold', size: 11 },
            formatter: (val) => val
          }
        },
        scales: {
          x: {
            grid: { color: '#1a2f4c' },
            ticks: { color: '#64748b' }
          },
          y: {
            grid: { display: false },
            ticks: { color: '#ffffff', font: { size: 10, weight: 'bold' } }
          }
        }
      }
    });

    // 2. Gráfico de Dona con Porcentajes Activados
    if (donutChart) donutChart.destroy();
    donutChart = new Chart(document.getElementById('donutChart'), {
      type: 'doughnut',
      data: {
        labels: asesores.map(a => a.nombre),
        datasets: [{ data: asesores.map(a => a.ventas), backgroundColor: bgColores, borderWidth: 0 }]
      },
      options: {
        cutout: '72%',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right', labels: { color: '#fff', font: { size: 9 } } },
          datalabels: {
            color: '#ffffff',
            font: { weight: 'bold', size: 9 },
            formatter: (v) => totalVentas === 0 ? '0%' : `~${((v / totalVentas) * 100).toFixed(1)}%`
          }
        }
      }
    });
  }

  // Carga inicial
  document.getElementById('excelInput').value = `28/09/2026\tROSMARY\t10\t5 GLYCONORM / 3 CARDIOX / 2 MIX\n\tCRISEL\t3\t1 CARDIOX / 2 PAPAYA\n\tNIDIA\t3\t3 GLYCONORM\n\tXAVIER\t3\t3 GLYCONORM\n\tMIGUEL\t8\t4 PAPAYA / 3 CALMANO / 1 GLYCONORM\n\tNATACHA\t7\t5 PAPAYA / 4 GLYCONORM\n\tYURBI\t9\t1 FLEXACIL / 8 PAPAYA\n\tLEIDY\t2\t3 PAPAYA\n\tALEJANDRA\t4\t3 PAPAYA / 1 GLYCONORM\n\tSAIDA\t3\t2 PAPAYA / 1 GLYCONORM\n\tYUSBELY\t2\t2 GLYCONORM\n\tKAREN\t2\t2 GLYCONORM`;

  procesarTextoPegado();
</script>

</body>
</html>
